name: Java Maven Tests

on:
  push:
    branches:
      - main
      - part2-messages
  pull_request:
    branches:
      - main
      - part2-messages

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Run Maven tests
        run: mvn -B test
